name: Release

# Builds a signed Android App Bundle and attaches it to a GitHub Release.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   UPLOAD_KEYSTORE_BASE64  base64 of the upload keystore:
#                             base64 -w0 my-upload-key.jks
#   UPLOAD_STORE_PASSWORD   keystore password
#   UPLOAD_KEY_PASSWORD     password of the "upload" key alias
#
# The alias itself is hardcoded as "upload" in app/build.gradle.kts.
#
# Uploading to Play Console is deliberately not wired up: that needs a Google
# Play service account JSON and a published app listing. Add a step using
# r0adkll/upload-google-play once those exist.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are present
        # Fail early with a readable message instead of an opaque Gradle
        # signing error 20 minutes into the build.
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing UPLOAD_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing UPLOAD_STORE_PASSWORD"
          [ -n "$KEY_PASSWORD" ] || missing="$missing UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the obsolete "tools"
          # package, which Google removed from the SDK repo — sdkmanager exits 1
          # on it. Install nothing here and let AGP pull the platform and
          # build-tools it needs (the runner image already ships platform-tools).
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"

      - name: Bundle release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            app/build/outputs/bundle/release/*.aab \
          || gh release upload "${GITHUB_REF_NAME}" \
            app/build/outputs/bundle/release/*.aab --clobber
